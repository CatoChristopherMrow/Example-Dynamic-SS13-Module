id = "example-dynamic-module"
name = "Example Dynamic Module"
version = "1.0.0"
module_api = "1"
description = "A tiny external module used to validate Dynamic SS13 Modules integration."

[source]
repo = "https://github.com/CatoChristopherMrow/Example-Dynamic-SS13-Module.git"
default_branch = "main"

[compat]
target = "tgstation"
minimum_dynamic_modules = "0.1.0"

[build]
dm_files = ["code/**/*.dm"]
test_files = ["tests/**/*.dm"]

[config]
schema = "config/config.schema.json"
defaults = "config/default.toml"
version = 1

